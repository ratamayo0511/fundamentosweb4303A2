<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página Principal</title>
    <style>
        body {
            background-color: #f0f8ff; 
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1e90ff;
            color: white;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        h2 {
            color: #ff4500; 
            margin-top: 30px;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        ul {
            list-style-type: square;
            display: inline-block;
            text-align: left;
        }

        li {
            color: #008000; 
            margin: 5px 0;
        }

        nav a {
            text-decoration: none;
            color: white;
            background-color: #1e90ff;
            padding: 8px 12px;
            border-radius: 5px;
            margin: 5px;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: #ff4500;
        }

        img {
            margin: 15px;
            border: 3px solid #1e90ff;
            border-radius: 10px;
            transition: transform 0.3s;
            max-width: 90%;
        }

        img:hover {
            transform: scale(1.05);
        }

        footer {
            margin-top: 40px;
            background: #1e90ff;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenido a mi página</h1>
        <p>Hola, soy <strong>Andrés Chacón</strong> y este es mi primer sitio web en HTML.</p>
    </header>

    <section>
        <h2>Mis hobbies</h2>
        <ul>
            <li>Ver películas y series</li>
            <li>Jugar videojuegos</li>
            <li>Hacer ejercicio</li>
            <li>Escuchar música</li>
            <li>Jugar fútbol</li>
        </ul>
    </section>

    <section>
        <h2>Galería</h2>
        <img src="img/andres.jpg" alt="Foto de Andrés Chacón" width="200">
        <img src="img/andres7.jpg" alt="Otra foto de Andrés" width="200">
        <img src="img/andres5.jpg" alt="Andrés en otra imagen" width="200">
    </section>

    <nav>
        <a href="sobre_mi.html">Sobre mí</a> 
        <a href="contacto.html">Contacto</a>
    </nav>

    <footer>
        <p>&copy; 2025 Andrés Chacón - AndrexDynasty</p>
    </footer>
</body>
</html>
